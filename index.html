<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEM-1 AlgoBot Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0D1117;font-family:'Segoe UI',system-ui,sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.topbar{background:#161B22;border-bottom:1px solid #21262D;padding:0 28px;display:flex;align-items:center;gap:0;height:52px;flex-shrink:0;}
.logo{font-weight:800;font-size:15px;color:#58A6FF;letter-spacing:1px;margin-right:28px;white-space:nowrap;}
.logo span{color:#8B949E;font-weight:400;}
.tabs{display:flex;gap:2px;align-items:center;height:100%;}
.tab{display:flex;align-items:center;gap:7px;padding:0 18px;height:100%;cursor:pointer;border:none;background:transparent;color:#8B949E;font-size:13px;font-family:inherit;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.tab:hover{color:#E6EDF3;}
.tab.active{color:#E6EDF3;border-bottom-color:#58A6FF;}
.tab .vpill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:rgba(88,166,255,.12);color:#58A6FF;border:1px solid rgba(88,166,255,.25);}
.tab.v1 .vpill{background:rgba(139,92,246,.12);color:#A78BFA;border-color:rgba(139,92,246,.25);}
.tab.v2 .vpill{background:rgba(88,166,255,.12);color:#58A6FF;border-color:rgba(88,166,255,.25);}
.tab.coming{opacity:.55;cursor:default;pointer-events:none;}
.tab.coming .vpill{background:rgba(33,38,45,.8);color:#8B949E;border-color:#21262D;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.info-chip{font-size:11px;color:#8B949E;background:#0D1117;border:1px solid #21262D;padding:3px 10px;border-radius:20px;}
.frame-area{flex:1;position:relative;overflow:hidden;}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;}
iframe.visible{display:block;}
.loading{position:absolute;inset:0;background:#0D1117;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;transition:opacity .3s;}
.loading.hidden{opacity:0;pointer-events:none;}
.spin{width:32px;height:32px;border:3px solid #21262D;border-top-color:#58A6FF;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#8B949E;font-size:13px;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">SISTEM<span>-1</span></div>
    <div class="tabs">
      <button class="tab v1 active" data-src="v1/index.html" onclick="switchTab(this)">
        <span>Baseline</span>
        <span class="vpill">v1 · ~3 Haz 2026</span>
      </button>
      <button class="tab v2" data-src="v2/index.html" onclick="switchTab(this)">
        <span>Post-Optimization</span>
        <span class="vpill">v2 · 22 Haz 2026</span>
      </button>
      <button class="tab coming">
        <span>Sonraki Analiz</span>
        <span class="vpill">v3 · yakında</span>
      </button>
    </div>
    <div class="topbar-right">
      <div class="info-chip">Paper Trading · $10,000/bot</div>
      <div class="info-chip">CNS Scalp + CNS Swing</div>
    </div>
  </div>
  <div class="frame-area">
    <div class="loading" id="loading">
      <div class="spin"></div>
      <p>Yükleniyor...</p>
    </div>
    <iframe id="frame-v1" src="v1/index.html" class="visible" onload="frameLoaded()"></iframe>
    <iframe id="frame-v2" src="" onload="frameLoaded()"></iframe>
  </div>
</div>
<script>
let loaded = {v1: false, v2: false};
function frameLoaded(){
  document.getElementById('loading').classList.add('hidden');
}
function switchTab(btn){
  if(btn.classList.contains('active')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const src = btn.dataset.src;
  const key = src.split('/')[0];
  const frame = document.getElementById('frame-' + key);
  document.querySelectorAll('iframe').forEach(f => f.classList.remove('visible'));
  if(!loaded[key]){
    document.getElementById('loading').classList.remove('hidden');
    frame.src = src;
    loaded[key] = true;
  }
  frame.classList.add('visible');
  location.hash = key;
}
window.addEventListener('DOMContentLoaded', () => {
  loaded['v1'] = true;
  const hash = location.hash.replace('#','');
  if(hash === 'v2'){
    const v2btn = document.querySelector('.tab.v2');
    if(v2btn) switchTab(v2btn);
  }
});
</script>
</body>
</html>
